<title>Súper Paco</title>
<!-- @styles: aquí se insertan los estilos (enlazados en desarrollo, incrustados al compilar) -->
<canvas id="game" width="320" height="240" tabindex="0" aria-label="Súper Paco: juego de plataformas"></canvas>
<div id="touch-controls" aria-hidden="true">
  <div class="touch-button" id="touch-left" data-button="left">◀</div>
  <div class="touch-button" id="touch-right" data-button="right">▶</div>
  <div class="touch-button" id="touch-down" data-button="down">▼</div>
  <div class="touch-button" id="touch-run" data-button="run">B</div>
  <div class="touch-button" id="touch-jump" data-button="jump">A</div>
  <div class="touch-button is-small" id="touch-start" data-button="start">START</div>
  <div class="touch-button is-small" id="touch-pause" data-button="pause">SIESTA</div>
</div>
<!-- @script: aquí se inserta el código (módulo en desarrollo, empaquetado al compilar) -->
